# With a database the gateway also reads virtual keys, and a JWT the core verifies is still served
# natively. Only a token shaped like an Entra agent's (`iss`, `tid` and `azp`) asks for the managed
# agent read, which is not native yet.
enterprise: true

config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key
    enable_jwt_auth: true
    litellm_jwtauth:
      admin_allowed_routes: [/v1/messages]

keys:
  sk-claude: [claude]

requests:
  - name: a proxy admin JWT
    jwt: {claims: {scope: litellm_proxy_admin}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a user JWT with no team
    jwt: {claims: {sub: user-123}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a JWT shaped like an Entra agent's
    jwt: {claims: {sub: agent-1, iss: "https://login.microsoftonline.com/tenant-1/v2.0", tid: tenant-1, azp: app-1}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: not_native

  - name: a virtual key beside JWT auth
    headers: {authorization: Bearer sk-claude}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a virtual key choosing a team by header
    headers: {authorization: Bearer sk-claude, x-litellm-team-id: team-1}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: headers
    over: x-litellm-team-id
